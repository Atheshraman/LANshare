spring.application.name=demo.pc
# ===== Server / HTTPS =====

server.address=0.0.0.0
server.port=8080


# ===== Tomcat: large-file / long-running request support =====
# Remove default request-size ceilings — we control size checks ourselves via the handshake
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=-1
# Prevent timeouts mid-transfer on large or slow uploads (30 min — tune to your largest expected file/LAN speed)
server.tomcat.connection-timeout=1800000
server.tomcat.keep-alive-timeout=1800000
# Thread pool — fine as-is for a handful of peers; raise only if you add the multi-peer "hub" tier later
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10

# ===== Multipart — DISABLED, using raw streamed request bodies instead =====
spring.servlet.multipart.enabled=false

# ===== Application identity =====
app.instance-name=FILESHARE-PC

# ===== Chunked transfer =====
app.transfer.chunk-size-bytes=8388608
# ^ 8MB per chunk — adjust based on your own speed testing
app.transfer.chunk-threshold-bytes=52428800
# ^ Files above 50MB get chunked; smaller files transfer as a single stream
app.transfer.parallel-chunk-uploads=4
# ^ Number of concurrent chunk uploads from the sender's thread pool

# ===== File storage =====
app.storage.download-dir=${LOCALAPPDATA}/LANShare/downloads
app.storage.temp-chunk-dir=./temp-chunks

# ===== Token / request expiry (read by your @Scheduled cleanup task) =====
app.security.token-ttl-seconds=120
app.security.pending-request-ttl-seconds=300

# ===== Rate limiting (Bucket4j config, read by your interceptor) =====
app.ratelimit.requests-per-minute=10

# ===== Caching =====
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# ===== Logging =====
logging.level.root=INFO
logging.level.javax.jmdns=WARN
logging.level.com.example.demo.pc=DEBUG